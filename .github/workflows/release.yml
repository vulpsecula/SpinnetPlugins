name: Release Plugins

# Publishes one GitHub Release per official Plugin version not yet released,
# tagged <plugin-id>/v<version> with the asset <plugin-id>.spinnetplugin.zip.
# Existing tags and releases are never changed: a released version whose
# package changed fails the plan instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugins
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release tooling
        run: python3 -B -m unittest discover -s Tests/Tooling -p test_release_plugins.py -v

      - name: Plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I script/release_plugins.py plan --repo "$GITHUB_REPOSITORY"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I script/release_plugins.py publish --repo "$GITHUB_REPOSITORY"
